<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#29262b" />
    <meta name="description" content="Offline book-list and library inventory search." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Book Scout</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="topline">
          <p class="eyebrow">BOOK SCOUT</p>
          <div class="top-actions">
            <span id="connection" class="status-pill">OFFLINE READY</span>
            <button id="install-button" class="quiet-button" hidden>INSTALL</button>
          </div>
        </div>
        <h1>Is this one on the list?</h1>
      </header>

      <button id="scan-button" class="scan-button" type="button">
        <span class="scan-icon" aria-hidden="true">▦</span>
        Scan ISBN barcode
      </button>

      <form id="search-form" class="search-form" role="search">
        <span class="search-icon" aria-hidden="true"></span>
        <label class="sr-only" for="search-input">Title, author, ISBN, or list</label>
        <input id="search-input" type="search" inputmode="search" autocomplete="off"
               placeholder="Title, author, ISBN, or list" />
        <button type="submit">CHECK</button>
      </form>

      <section aria-live="polite" aria-busy="true" id="results-section">
        <div class="results-heading">
          <h2 id="results-title">Loading catalog…</h2>
          <span id="catalog-count"></span>
        </div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <dialog id="scanner-dialog" class="scanner-dialog">
      <div class="scanner-header">
        <div>
          <p class="eyebrow">ISBN SCANNER</p>
          <h2>Point at the barcode</h2>
        </div>
        <button id="close-scanner" class="close-button" aria-label="Close scanner">×</button>
      </div>
      <div class="video-frame">
        <video id="scanner-video" playsinline muted></video>
        <div class="target-box" aria-hidden="true"></div>
      </div>
      <p id="scanner-message">Starting camera…</p>
    </dialog>

    <template id="book-template">
      <article class="book-card">
        <div class="book-topline">
          <div>
            <h3 class="book-title"></h3>
            <p class="book-author"></p>
          </div>
          <span class="owned-badge"></span>
        </div>
        <ul class="book-lists"></ul>
        <p class="book-isbn"></p>
        <button class="owned-button" type="button"></button>
      </article>
    </template>

    <script type="module" src="./app.js?v=20261118-isbn2"></script>
  </body>
</html>
